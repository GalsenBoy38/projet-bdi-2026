# FestiBed - Groupe 3 - Base H2 locale (fichier) : le schéma est créé par Hibernate à partir des entités,
# les données de démonstration par config/DataInitializer (aucun script SQL).
spring:
  application:
    name: festibed
  datasource:
    url: jdbc:h2:file:./target/h2/festibed;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

---
# Profil Oracle : mvn spring-boot:run -Dspring-boot.run.profiles=oracle
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${FESTIBED_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${FESTIBED_DB_USER:festibed}
    password: ${FESTIBED_DB_PASSWORD}
